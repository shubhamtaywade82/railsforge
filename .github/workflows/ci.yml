name: CI

on:
  push:
    branches: [master]
  # No `branches:` filter — every PR gets validated regardless of its base branch.
  # (A `pull_request: branches: [master]` filter here would silently skip CI for any
  # PR targeting a feature/integration branch, which is exactly the kind of PR this
  # repo has used while a larger feature branch is still unmerged.)
  pull_request:
  # Manual runs on any branch (Actions tab / API) — useful for exercising the OS matrix without a PR.
  workflow_dispatch:

jobs:
  validate:
    name: Lint, Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # @vscode/vsce (used by the "Build VSIX Package" step) requires Node >= 20,
        # so 18.x can't run this job even though lint/type-check/build/test all pass on it.
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript Type Check
        run: pnpm run type-check

      # Fetches the pinned ruby-agent-skills commit and verifies its content hash (skills-pin.json);
      # REQUIRE makes a network/hash failure fail CI instead of silently shipping without skills.
      - name: Compile Extension (Webpack)
        run: pnpm run compile
        env:
          RAILSFORGE_REQUIRE_SKILLS: '1'

      # The standalone MCP server runs outside VS Code; a stray `import 'vscode'` anywhere in
      # its import graph would crash it at startup, so guard the built bundle.
      - name: Native module smoke test (better-sqlite3, tree-sitter-ruby)
        if: matrix.node-version == '22.x'
        run: pnpm run native-smoke

      - name: Check the MCP server bundle has no vscode dependency
        run: "! grep -q 'require(\"vscode\")' dist/mcp/server.js"

      - name: Run Vitest Unit Tests
        run: pnpm test

      # Boots a real VS Code Extension Host (Electron under xvfb) with the webpack build
      # and a two-folder multi-root workspace: checks activate(), that every contributed
      # command is registered, and per-folder schema isolation. One Node version is enough.
      - name: Run Extension Host Integration Tests
        if: matrix.node-version == '22.x'
        run: xvfb-run -a pnpm run test:host

      - name: Build VSIX Package
        run: pnpm run vsce-package

      # Lets a PR reviewer download and manually install/test the exact build a PR
      # produces, without checking it out and building it themselves. Only the
      # Node 22.x build is uploaded — one artifact is enough for manual testing,
      # and the matrix already proves both versions build/test identically.
      - name: Upload VSIX artifact
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: railsforge-vsix
          path: railsforge.vsix
          retention-days: 14

  # The same build on the other operating systems. RailsForge ships native modules (better-sqlite3,
  # tree-sitter) and spawns Ruby tooling, so "green on Linux" does not imply "works on Windows/macOS".
  # Ubuntu is already covered by `validate` above (Node 20 + 22, plus the minimum-VS-Code host run).
  cross-platform:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: 'Windows x64' }
          - { os: macos-latest, label: 'macOS arm64' }
          - { os: macos-15-intel, label: 'macOS x64' }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript Type Check
        run: pnpm run type-check

      - name: Compile Extension (Webpack)
        run: pnpm run compile
        env:
          RAILSFORGE_REQUIRE_SKILLS: '1'

      # Loads the bundled native modules exactly as the extension does and exercises them.
      - name: Native module smoke test (better-sqlite3, tree-sitter-ruby)
        run: pnpm run native-smoke

      - name: Check the MCP server bundle has no vscode dependency
        shell: bash
        run: "! grep -q 'require(\"vscode\")' dist/mcp/server.js"

      - name: Run Vitest Unit Tests
        run: pnpm test

      # Real VS Code (latest stable) with the multi-root fixture. Windows/macOS runners have a display.
      - name: Run Extension Host Integration Tests (stable)
        run: pnpm run test:host:stable

      - name: Build VSIX Package
        run: pnpm run vsce-package

  ruby-addon:
    name: Ruby LSP Add-on (ruby-lsp ${{ matrix.ruby-lsp }})
    runs-on: ubuntu-latest
    # Runs the add-on's Minitest suite through ruby-lsp's own add-on loader and Hover
    # request. ruby-lsp labels its add-on API experimental, so besides the locked
    # version we also test against the newest release to catch API drift early.
    strategy:
      fail-fast: false
      matrix:
        ruby-lsp: [locked, latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ruby-lsp-addon

      # setup-ruby installs in frozen/deployment mode; unfreeze so this job (only) may move ruby-lsp forward.
      - name: Use latest ruby-lsp
        if: matrix.ruby-lsp == 'latest'
        working-directory: ruby-lsp-addon
        run: |
          bundle config set --local frozen false
          bundle config set --local deployment false
          bundle update ruby-lsp

      - name: Ruby Syntax Check
        working-directory: ruby-lsp-addon
        run: find lib -name '*.rb' -print0 | xargs -0 -n1 ruby -c

      - name: Build Gem
        working-directory: ruby-lsp-addon
        run: gem build railsforge-ruby-lsp.gemspec

      - name: Run Add-on Tests (against real ruby-lsp)
        working-directory: ruby-lsp-addon
        run: bundle exec rake test
