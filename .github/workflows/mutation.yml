name: Mutation testing

# Mutation-tests the security/correctness-critical pure modules (see scripts/mutation.mjs).
# Slow (minutes per group), so it runs weekly, on demand, and on PRs that touch those modules.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    paths:
      - 'src/util/WorkspacePath.ts'
      - 'src/util/ProjectProcess.ts'
      - 'src/workspace/Trust.ts'
      - 'src/skills/SafetyRules.ts'
      - 'src/agent/AgentLoop.ts'
      - 'src/semantic/Freshness.ts'
      - 'src/diagnostics/Diagnostics.ts'
      - 'src/patch/LineDiff.ts'
      - 'scripts/mutation.mjs'
      - 'stryker.config.json'

permissions:
  contents: read

jobs:
  mutation:
    name: Stryker (command runner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run mutation groups
        run: pnpm run mutation
        env:
          STRYKER_CONCURRENCY: '2'
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports
          path: reports/mutation/*.json
          retention-days: 30
