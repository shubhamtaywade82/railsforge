name: Release

# Tags:  vX.Y.Z      -> stable release
#        vX.Y.Z-pre  -> Marketplace pre-release (package.json must say X.Y.Z; vsce rejects semver suffixes)
# The VSIX that passes the installed-package smoke test is the exact file that gets published
# (artifact + sha256 re-verified in the publish job).
on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Verify & Build Release Package
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      vsix_sha256: ${{ steps.hash.outputs.sha256 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Fail fast, before running the (slower) checks below, if the pushed tag and
      # package.json disagree on the version — publishing under a mismatched
      # version is the kind of mistake that's genuinely hard to undo once it's on
      # the Marketplace, so this is a hard gate, not a warning.
      - name: Verify tag matches package.json version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE=false
          if [[ "$TAG_VERSION" == *-pre ]]; then
            PRERELEASE=true
            TAG_VERSION="${TAG_VERSION%-pre}"
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version: $TAG_VERSION (pre-release: $PRERELEASE)"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match package.json's version ($PKG_VERSION). Bump package.json and re-tag."
            exit 1
          fi
          if ! grep -q "^## $PKG_VERSION\b" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $PKG_VERSION' section. Rename 'Unreleased' before tagging."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript Type Check
        run: pnpm run type-check

      - name: Run Vitest Unit Tests
        run: pnpm test

      - name: Build Production Package
        run: pnpm run vsce-package
        env:
          RAILSFORGE_REQUIRE_SKILLS: '1'

      # Gate: install the built VSIX into a clean VS Code and verify the installed copy
      # (payload, native modules in Electron, activation, commands, LM tools, MCP server, AST index).
      - name: Installed VSIX smoke test
        run: xvfb-run -a pnpm run vsix-smoke

      - name: Record VSIX checksum
        id: hash
        run: |
          sha256sum railsforge.vsix | tee railsforge.vsix.sha256
          echo "sha256=$(sha256sum railsforge.vsix | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: railsforge-vsix
          path: |
            railsforge.vsix
            railsforge.vsix.sha256
          retention-days: 90

  publish:
    name: Publish Release
    needs: verify
    runs-on: ubuntu-latest
    # Requires a "release" environment configured under repo Settings > Environments
    # with required reviewers to actually gate on human approval — without that
    # configuration this environment reference is a no-op and the job runs straight
    # through. See README.md's "Release Process" section for setup instructions.
    environment: release

    permissions:
      contents: write
      # Entra ID (OIDC) login for the Marketplace — preferred over a long-lived PAT.
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: railsforge-vsix

      # Publish exactly the bytes the smoke test ran against.
      - name: Verify VSIX is the smoke-tested build
        env:
          EXPECTED: ${{ needs.verify.outputs.vsix_sha256 }}
        run: |
          ACTUAL="$(sha256sum railsforge.vsix | cut -d' ' -f1)"
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::VSIX differs from the smoke-tested build"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            railsforge.vsix
            railsforge.vsix.sha256
          draft: false
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Marketplace PATs are being retired (Dec 1, 2026). Preferred path: Microsoft Entra ID via GitHub
      # OIDC — set the repository *variables* AZURE_CLIENT_ID and AZURE_TENANT_ID (see README "Release
      # Process"). VSCE_PAT remains as a fallback until it is removed.
      - name: Azure login (Entra ID, OIDC)
        if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Code Marketplace (Entra ID)
        if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != ''
        run: pnpm exec vsce publish --azure-credential --packagePath railsforge.vsix ${{ needs.verify.outputs.prerelease == 'true' && '--pre-release' || '' }}

      - name: Publish to VS Code Marketplace (PAT fallback)
        if: (vars.AZURE_CLIENT_ID == '' || vars.AZURE_TENANT_ID == '') && env.VSCE_PAT != ''
        run: pnpm exec vsce publish --packagePath railsforge.vsix ${{ needs.verify.outputs.prerelease == 'true' && '--pre-release' || '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Marketplace publish skipped (no credentials)
        if: (vars.AZURE_CLIENT_ID == '' || vars.AZURE_TENANT_ID == '') && env.VSCE_PAT == ''
        run: echo "::warning::Neither Entra ID variables (AZURE_CLIENT_ID/AZURE_TENANT_ID) nor VSCE_PAT are set — the GitHub Release was created but nothing was published to the VS Code Marketplace."
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: pnpm dlx ovsx publish railsforge.vsix ${{ needs.verify.outputs.prerelease == 'true' && '--pre-release' || '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
