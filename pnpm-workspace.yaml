packages:
  - "."

allowBuilds:
  '@vscode/vsce-sign': true
  # Ships prebuilt binaries for every platform (prebuilds/); a source build only adds a C++ toolchain requirement.
  better-sqlite3: false
  esbuild: true
  keytar: true
  tree-sitter: true
  tree-sitter-ruby: true

minimumReleaseAgeExclude:
  - '@nemesis-oss/ollama-sdk@1.0.0'

verifyDepsBeforeRun: false
